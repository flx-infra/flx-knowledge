version: '3.6'

services:
  kb-postgres:
    image: pgvector/pgvector:0.8.2-pg18
    networks:
      - kb
    ports:
      - '${KB_DB_PORT:-7004}:5432'
    environment:
      - POSTGRES_DB=${KB_DB_NAME:-flx_knowledge}
      - POSTGRES_USER=${KB_DB_USER:?falta KB_DB_USER}
      - POSTGRES_PASSWORD=${KB_DB_PASSWORD:?falta KB_DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8
    volumes:
      # `/var/lib/postgresql`, NO `/var/lib/postgresql/data`: en pg18+ el mount
      # en /data hace que el contenedor no arranque.
      - 'kb_pgdata:/var/lib/postgresql'
    deploy:
      placement:
        constraints:
          - "${NODE:?falta NODE, debe ser un worker concreto}"
          - node.role == worker
      resources:
        reservations:
          memory: 256M
    logging:
      driver: loki
      options:
        loki-url: ${LOKI_URL:?falta LOKI_URL}

  kb-api:
    image: ${KB_IMAGE:-fabreguesm/flx-knowledge}:${KB_TAG:-0.5.3}
    hostname: ${KB_HOSTNAME:-flxknowledge-flexxus-com-ar}
    ports:
      - "${KB_API_PORT:-7003}:8000"
    networks:
      - kb
      - traefik
    environment:
      - DATABASE_URL=postgresql://${KB_DB_USER}:${KB_DB_PASSWORD}@kb-postgres:5432/${KB_DB_NAME:-flx_knowledge}
      - KB_PROVIDER_API_KEY=${KB_PROVIDER_API_KEY:-}
      - KB_BOOTSTRAP_ADMIN_KEY=${KB_BOOTSTRAP_ADMIN_KEY:-}
      - KB_LLM_PROVIDER=${KB_LLM_PROVIDER:-gemini}
      - KB_EMBEDDING_PROVIDER=${KB_EMBEDDING_PROVIDER:-gemini}
    deploy:
      placement:
        constraints:
          - "${NODE:?falta NODE, debe ser un worker concreto}"
          - node.role == worker
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 128M
    logging:
      driver: loki
      options:
        loki-url: ${LOKI_URL:?falta LOKI_URL}

volumes:
  kb_pgdata:
    name: "${SERVICE_NAME:?falta SERVICE_NAME}_pgdata"

networks:
  kb:
    driver: overlay
    attachable: true
  traefik:
    external: true
    name: traefik-network
